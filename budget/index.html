<script>try{const t=JSON.parse(localStorage.getItem('mf_theme')||'{}');if(t.m&&t.m!=='auto')document.documentElement.dataset.mode=t.m;document.documentElement.dataset.acc=t.a||'violet';}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#f4f5f9;--card:#fff;--line:#e5e7ef;--ink:#121528;--ink2:#4b5069;--ink3:#868aa3;--acc:#5b5bd6;--acc2:#8b7cf6;--dep:#e0486b;--rev:#12a26b;--warn:#f59e0b;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-mode=clair]){color-scheme:dark;--bg:#0d0f1c;--card:#161a2e;--line:#262b45;--ink:#eef0fb;--ink2:#bcc0d8;--ink3:#868aa8;--acc:#8b8cff;--acc2:#a78bfa;--dep:#ff6b8b;--rev:#34d399}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,#151a3a,#2b2d7a 55%,#5b4bd6);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 14px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px;font-weight:700;flex:1}
.ibtn{appearance:none;border:0;background:rgba(255,255,255,.16);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:18px;height:18px}
.month{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.month button{appearance:none;border:0;background:rgba(255,255,255,.16);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.month b{font-size:16px;text-transform:capitalize}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sum div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.sum span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.sum b{font-size:18px}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(18,21,40,.04),0 4px 14px rgba(18,21,40,.04)}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);margin-left:6px}
.subc{margin-left:28px;padding:6px 0 6px 10px;border-left:2px solid var(--line);font-size:13px;color:var(--ink2);display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.h2{font-size:18px;font-weight:700;margin:0 0 4px}
.sub{font-size:13px;color:var(--ink3);margin:0 0 10px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar div{height:100%;border-radius:4px;background:var(--acc)}
.bud{padding:10px 0;border-top:1px solid var(--line)}
.bud:first-child{border-top:0;padding-top:2px}
.bud .meta{font-size:13px;color:var(--ink3)}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-child{border-top:0}
.emo{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t span{font-size:13px;color:var(--ink3)}
.m-dep{color:var(--dep);font-weight:700;white-space:nowrap}.m-rev{color:var(--rev);font-weight:700;white-space:nowrap}
.empty{color:var(--ink3);font-size:14px;padding:6px 0}
.hb{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb .t{height:14px;border-radius:0 4px 4px 0;background:var(--dep);min-width:2px}
.chart svg{display:block;width:100%}
.chart text{fill:var(--ink3);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(91,91,214,.45);cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;color:var(--ink3);cursor:pointer}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:var(--acc);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:none;flex:1;padding:8px;border-radius:8px;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.l{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:var(--card);-webkit-appearance:none;appearance:none}
input.big{font-size:30px;font-weight:700;text-align:center;padding:14px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cats button span{font-size:22px}
.cats button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--ink);font-weight:600}
.btn{appearance:none;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:16px;border-radius:12px;padding:13px;width:100%;margin-top:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--dep);border:1px solid var(--dep)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:720px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.xbtn{appearance:none;border:0;background:var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer}
.lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#151a3a,#2b2d7a 55%,#5b4bd6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock h2{margin:12px 0 4px;font-size:22px}
.lock p{margin:0 0 18px;opacity:.85;text-align:center}
.dots{display:flex;gap:14px;margin-bottom:22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{appearance:none;border:0;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;cursor:pointer}
.pad button:empty{visibility:hidden}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--card);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.goal{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.small{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12.5px;color:var(--ink2)}
.kpi b{display:block;font-size:21px;margin-top:2px;letter-spacing:-.01em}
.kpi small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.up{color:var(--rev)}.down{color:var(--dep)}
.tip{border:0;background:linear-gradient(150deg,#2b2d7a,#5b4bd6);color:#fff}
.tip .sub,.tip .kv span{color:rgba(255,255,255,.8)}
.tip .kv{border-top-color:rgba(255,255,255,.18)}
.tip .h2{color:#fff}
.tip .big{font-size:30px;font-weight:800;margin:4px 0}
.tip .btn{background:#fff;color:#2b2d7a}
.tip .chips button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.tip.warn{background:linear-gradient(150deg,#7a1f3d,#d0436a)}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:none}
.dleg{flex:1;min-width:0;font-size:13px}
.dleg div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:46vh;overflow:auto;padding:4px 0}
.emogrid button{appearance:none;border:1px solid transparent;background:var(--bg);border-radius:10px;font-size:24px;padding:6px 0;cursor:pointer}
.emogrid button.on{border-color:var(--acc)}
.emobtn{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;font-size:30px;width:64px;height:64px;cursor:pointer}
.acc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.acc:first-child{border-top:0}
.acc .t{flex:1;min-width:0}.acc .t b{display:block}.acc .t span{font-size:13px;color:var(--ink3)}

:root[data-mode=sombre]{color-scheme:dark;--bg:#0d0f1c;--card:#161a2e;--line:#262b45;--ink:#eef0fb;--ink2:#bcc0d8;--ink3:#868aa8;--acc:#8b8cff;--dep:#ff6b8b;--rev:#34d399}
:root[data-mode=clair]{color-scheme:light}
:root[data-acc=bleu]{--acc:#2563eb;--h1:#0c1f4d;--h2:#1d4ed8;--h3:#3b82f6}
:root[data-acc=rose]{--acc:#db2777;--h1:#4a0d2b;--h2:#9d174d;--h3:#ec4899}
:root[data-acc=vert]{--acc:#059669;--h1:#06362a;--h2:#047857;--h3:#10b981}
:root[data-acc=orange]{--acc:#ea580c;--h1:#43170a;--h2:#c2410c;--h3:#f97316}
:root[data-acc=violet]{--acc:#5b5bd6;--h1:#151a3a;--h2:#2b2d7a;--h3:#5b4bd6}
.top,.lock{background:linear-gradient(160deg,var(--h1,#151a3a),var(--h2,#2b2d7a) 55%,var(--h3,#5b4bd6))!important}
.tip:not(.warn){background:linear-gradient(150deg,var(--h2,#2b2d7a),var(--h3,#5b4bd6))}
.fab{background:var(--h3,#5b4bd6)}
.colors{display:flex;gap:10px;margin-top:6px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink)}
.faceid{appearance:none;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;margin-bottom:18px;cursor:pointer}
</style>

<body>
<div class="lock hide" id="lock">
  <svg width="56" height="56" viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="rgba(255,255,255,.18)"/><rect x="13" y="18" width="30" height="22" rx="5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="36" cy="29" r="2.5" fill="#fff"/></svg>
  <h2 id="lock-t">Mes Finances</h2>
  <p id="lock-p">Entre ton code</p>
  <button class="faceid hide" id="btn-bio">Déverrouiller avec Face ID</button>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>

</div>

<header class="top">
  <div class="top-row">
    <h1>Mes Finances</h1>
    <button class="ibtn" id="btn-reglages" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>

<main>

  <button data-tab="accueil" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>

<script>
'use strict';
const KEY = 'mes_finances_v1', PINK = 'mes_finances_pin';
const fE = new Intl.NumberFormat('fr-FR', {style: 'currency', currency: 'EUR', maximumFractionDigits: 2});
const fE0 = new Intl.NumberFormat('fr-FR', {style: 'currency', currency: 'EUR', maximumFractionDigits: 0});
const fP = new Intl.NumberFormat('fr-FR', {style: 'percent', maximumFractionDigits: 0});
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const ym = (d) => d.slice(0, 7);
const DEF = {
  dep: [['courses', 'Courses', '🛒'], ['logement', 'Logement', '🏠'], ['transport', 'Transport', '⛽'], ['sante', 'Santé', '💊'], ['shopping', 'Shopping', '🛍️'], ['resto', 'Restaurants', '🍽️'], ['loisirs', 'Loisirs', '🎉'], ['abos', 'Abonnements', '📱'], ['beaute', 'Beauté', '💅'], ['cadeaux', 'Cadeaux', '🎁'], ['enfants', 'Enfants', '🧸'], ['autres', 'Autres', '📦']],
  rev: [['salaire', 'Salaire', '💶'], ['prime', 'Prime', '⭐'], ['aides', 'Aides', '🤝'], ['autres_r', 'Autres', '➕']]
};
let DB, S = {tab: 'accueil', mois: ym(today()), q: '', fCat: ''};

function load() {
  try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) { DB = null; }
  if (!DB) DB = {tx: [], cats: DEF.dep.map(([id, nom, emo]) => ({id, nom, emo, type: 'dep', budget: 0})).concat(DEF.rev.map(([id, nom, emo]) => ({id, nom, emo, type: 'rev', budget: 0}))), goals: []};
  DB.fixes = DB.fixes || [];
  DB.comptes = DB.comptes || [];
  DB.reglages = Object.assign({paie: 25, delai: 60, mode: 'auto', acc: 'violet'}, DB.reglages || {});
  applyTheme();
  DB.cats.forEach((c) => { if (c.parent === undefined) c.parent = null; });
  genFixes();
}
function applyTheme() {
  const r = document.documentElement;
  if (DB.reglages.mode === 'auto') r.removeAttribute('data-mode'); else r.dataset.mode = DB.reglages.mode;
  r.dataset.acc = DB.reglages.acc;
  try { localStorage.setItem('mf_theme', JSON.stringify({m: DB.reglages.mode, a: DB.reglages.acc})); } catch (e) {}
}
/* Dépenses et revenus fixes : une ligne créée chaque mois, au jour choisi */
function genFixes() {
  const now = today(), cur = ym(now);
  let n = 0;
  DB.fixes.forEach((f) => {
    if (!f.actif) return;
    for (let m = f.debut; m <= cur; m = addMois(m, 1)) {
      if (f.fin && m > f.fin) break;
      const [y, mo] = m.split('-').map(Number);
      const dmax = new Date(y, mo, 0).getDate();
      const date = m + '-' + String(Math.min(f.jour, dmax)).padStart(2, '0');
      if (date > now) break;
      if (DB.tx.some((t) => t.fixe === f.id && ym(t.date) === m)) continue;
      DB.tx.push({id: uid(), type: f.type, montant: f.montant, cat: f.cat, date, note: f.note, fixe: f.id});
      n++;
    }
  });
  if (n) save();
}
const mainOf = (id) => { const c = DB.cats.find((x) => x.id === id); return c && c.parent ? c.parent : id; };
const subs = (id) => DB.cats.filter((c) => c.parent === id);
const mains = (type) => DB.cats.filter((c) => c.type === type && !c.parent);
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('Mémoire pleine : exporte une sauvegarde'); } }
const cat = (id) => DB.cats.find((c) => c.id === id) || {nom: 'Autres', emo: '📦'};
const PAL = ['#5b5bd6', '#e0486b', '#12a26b', '#f59e0b', '#0ea5e9', '#a855f7', '#ef7d32', '#14b8a6', '#ec4899', '#84cc16', '#64748b', '#8b5cf6'];

const TYPES_C = [['Livret A', '🏦'], ['LDDS', '🌱'], ['LEP', '🛡️'], ['PEL', '🏠'], ['Assurance vie', '📈'], ['PEA', '📊'], ['Compte courant', '💳'], ['Épargne salariale', '🏢'], ['Crypto', '🪙'], ['Autre', '💰']];
function patriHist() {
  const dates = [...new Set(DB.comptes.flatMap((c) => c.hist.map((h) => h.d)))].sort();
  return dates.map((d) => ({d, v: DB.comptes.reduce((s, c) => { const h = c.hist.filter((x) => x.d <= d).pop(); return s + (h ? h.v : 0); }, 0)}));
}
function chartPatri() {
  const h = patriHist();
  if (h.length < 2) return '<div class="empty">La courbe apparaît dès que tu mets à jour un solde une deuxième fois.</div>';
  const W = 340, H = 160, bt = 22, t0 = 10, ml = 40;
  const max = niceMax(Math.max(...h.map((x) => x.v)) * 1.05);
  const t = (d) => Date.parse(d), a = t(h[0].d), b = t(h[h.length - 1].d) || a + 1;
  const x = (d) => ml + (W - ml - 6) * ((t(d) - a) / (b - a || 1)), y = (v) => t0 + (H - t0 - bt) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du patrimoine">`;
  [0, max / 2, max].forEach((v) => { s += `<line x1="${ml}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${ml - 5}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000).toLocaleString('fr-FR') + ' k' : Math.round(v)}</text>`; });
  s += `<polygon points="${x(h[0].d)},${y(0)} ${h.map((p) => x(p.d) + ',' + y(p.v)).join(' ')} ${x(h[h.length - 1].d)},${y(0)}" fill="var(--acc)" opacity=".12"/>`;
  s += `<polyline points="${h.map((p) => x(p.d) + ',' + y(p.v)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<text x="${ml}" y="${H - 5}">${new Date(h[0].d).toLocaleDateString('fr-FR', {month: 'short', year: '2-digit'})}</text><text x="${W}" y="${H - 5}" text-anchor="end">${new Date(h[h.length - 1].d).toLocaleDateString('fr-FR', {month: 'short', year: '2-digit'})}</text>`;
  return s + '</svg>';
}

    if (del) del.onclick = () => { if (!confirmDel()) return; DB.tx = DB.tx.filter((x) => x.id !== id); save(); closeSheet(); renderAll(); toast('Supprimé'); };
    if (!id) setTimeout(() => { const i = $('t-m'); if (i) i.focus(); }, 50);
  };
  draw();
}
let delArm = 0;
function confirmDel() { if (Date.now() - delArm < 3000) { delArm = 0; return true; } delArm = Date.now(); toast('Touche encore pour confirmer'); return false; }

function openCat(id, parent) {
  const c = id ? DB.cats.find((x) => x.id === id) : {nom: '', emo: parent ? cat(parent).emo : '🏷️', type: parent ? cat(parent).type : 'dep', budget: 0, parent: parent || null};
  const sl = id && !c.parent ? subs(id) : [];
  sheet(`${head(id ? (c.parent ? 'Sous-catégorie' : 'Catégorie') : parent ? 'Nouvelle sous-catégorie de ' + esc(cat(parent).nom) : 'Nouvelle catégorie')}
    <label class="l">Nom</label><input class="f" id="c-n" value="${esc(c.nom)}">
    <label class="l">Logo</label><button class="emobtn" id="c-e" type="button">${esc(c.emo)}</button>
    ${id || parent ? '' : '<label class="l">Type</label><select class="f" id="c-t"><option value="dep">Dépense</option><option value="rev">Revenu</option></select>'}
    <button class="btn" data-savecat>Enregistrer</button>
    ${id && !c.parent ? `<p class="grp" style="margin-top:18px">Sous-catégories</p>${sl.map((x) => `<div class="it" data-cat="${x.id}"><div class="emo">${x.emo}</div><div class="t"><b>${esc(x.nom)}</b></div><span style="color:var(--ink3)">›</span></div>`).join('') || '<div class="empty">Aucune.</div>'}<button class="btn ghost" data-newsub="${id}">+ Ajouter une sous-catégorie</button>` : ''}
    ${id && !DB.tx.some((t) => t.cat === id) && !subs(id).length && !DB.fixes.some((f) => f.cat === id) ? '<button class="btn danger" data-delcat>Supprimer</button>' : ''}`);
  const box = $('sh');
  $('c-e').onclick = () => pickEmoji($('c-e').textContent, (e) => { $('c-e').textContent = e; });
  box.querySelector('[data-savecat]').onclick = () => {
    const nom = $('c-n').value.trim(); if (!nom) { toast('Indique un nom'); return; }
    if (id) { c.nom = nom; c.emo = $('c-e').textContent.trim() || '🏷️'; } else DB.cats.push({id: uid(), nom, emo: $('c-e').textContent.trim() || '🏷️', type: parent ? cat(parent).type : $('c-t').value, budget: 0, parent: parent || null});
    save(); closeSheet(); renderAll();

}
function openFixe(id) {
  const f = id ? DB.fixes.find((x) => x.id === id) : {type: 'dep', montant: '', cat: mains('dep')[0].id, jour: new Date().getDate(), note: '', debut: ym(today()), fin: '', actif: true};

  sheet(`${head(id ? 'Fixe mensuel' : 'Nouveau fixe mensuel')}
    <div class="seg" data-ftype><button data-v="dep" class="${type === 'dep' ? 'on' : ''}">Dépense</button><button data-v="rev" class="${type === 'rev' ? 'on' : ''}">Revenu</button></div>
    <label class="l">Libellé</label><input class="f" id="f-n" value="${esc(f.note)}" placeholder="Loyer, Netflix, salaire…">
    <label class="l">Montant chaque mois</label><input class="f" id="f-m" inputmode="decimal" value="${f.montant === '' ? '' : String(f.montant).replace('.', ',')}">
    <label class="l">Catégorie</label><select class="f" id="f-c">${opts(type)}</select>
    <label class="l">Jour du mois</label><input class="f" id="f-j" type="number" min="1" max="31" value="${f.jour}">
    <label class="l">À partir de</label><input class="f" id="f-d" type="month" value="${f.debut}">
    <label class="l">Jusqu'à (facultatif)</label><input class="f" id="f-fin" type="month" value="${f.fin || ''}">
    <label class="sw"><span>Actif</span><input type="checkbox" id="f-a" ${f.actif ? 'checked' : ''}></label>
    <button class="btn" data-savefixe>Enregistrer</button>
    ${id ? '<button class="btn danger" data-delfixe>Supprimer (garde les mois passés)</button>' : ''}`);
  const box = $('sh');
  box.querySelector('[data-ftype]').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.v; sel = mains(type)[0].id; box.querySelectorAll('[data-ftype] button').forEach((x) => x.classList.toggle('on', x === b)); $('f-c').innerHTML = opts(type); };
  box.querySelector('[data-savefixe]').onclick = () => {
    const m = num($('f-m').value), j = Math.min(31, Math.max(1, parseInt($('f-j').value, 10) || 1));
    if (!(m > 0)) { toast('Indique un montant'); return; }
    const o = {id: id || uid(), type, montant: Math.round(m * 100) / 100, cat: $('f-c').value, jour: j, note: $('f-n').value.trim(), debut: $('f-d').value || ym(today()), fin: $('f-fin').value || '', actif: $('f-a').checked};
    if (id) DB.fixes[DB.fixes.findIndex((x) => x.id === id)] = o; else DB.fixes.push(o);
    genFixes(); save(); closeSheet(); renderAll(); toast('Fixe enregistré ✓');
  };
  const del = box.querySelector('[data-delfixe]');
  if (del) del.onclick = () => { if (!confirmDel()) return; DB.fixes = DB.fixes.filter((x) => x.id !== id); DB.tx.forEach((t) => { if (t.fixe === id) delete t.fixe; }); save(); closeSheet(); renderAll(); };
}
function openGoal(id) {
  const g = id ? DB.goals.find((x) => x.id === id) : {nom: '', emo: '🎯', cible: '', epargne: 0, date: ''};
  sheet(`${head(id ? 'Objectif' : 'Nouvel objectif')}
    <label class="l">Nom</label><input class="f" id="g-n" value="${esc(g.nom)}" placeholder="Vacances, voiture…">
    <label class="l">Logo</label><button class="emobtn" id="g-e" type="button">${esc(g.emo)}</button>
    <label class="l">Montant visé</label><input class="f" id="g-c" inputmode="decimal" value="${g.cible}">
    <label class="l">Déjà mis de côté</label><input class="f" id="g-s" inputmode="decimal" value="${g.epargne || ''}">
    <label class="l">Date visée (facultatif)</label><input class="f" id="g-d" type="date" value="${g.date || ''}">
    <button class="btn" data-savegoal>Enregistrer</button>
    ${id ? '<button class="btn danger" data-delgoal>Supprimer</button>' : ''}`);
  const box = $('sh');
  $('g-e').onclick = () => pickEmoji($('g-e').textContent, (e) => { $('g-e').textContent = e; });
  box.querySelector('[data-savegoal]').onclick = () => {

    const o = {id: id || uid(), nom, emo: $('g-e').textContent.trim() || '🎯', cible, epargne: ep > 0 ? ep : 0, date: $('g-d').value};

    save(); closeSheet(); renderAll();
  };
  const del = box.querySelector('[data-delgoal]');
  if (del) del.onclick = () => { if (!confirmDel()) return; DB.goals = DB.goals.filter((x) => x.id !== id); save(); closeSheet(); renderAll(); };
}
function openGoalAdd(id) {
  const g = DB.goals.find((x) => x.id === id);
  sheet(`${head(esc(g.emo) + ' ' + esc(g.nom))}<label class="l">Montant à ajouter (négatif pour retirer)</label><input class="f big" id="ga" inputmode="decimal" placeholder="0 €"><button class="btn" data-gaok>Valider</button>`);
  setTimeout(() => { const i = $('ga'); if (i) i.focus(); }, 50);
  $('sh').querySelector('[data-gaok]').onclick = () => { const v = num($('ga').value); if (!v) return; g.epargne = Math.max(0, Math.round((g.epargne + v) * 100) / 100); save(); closeSheet(); renderAll(); toast(g.epargne >= g.cible ? '🎉 Objectif atteint !' : 'Ajouté ✓'); };
}
function openReglages() {
  sheet(`${head('Réglages')}
    <div class="kv"><span>Mouvements enregistrés</span><b>${DB.tx.length}</b></div>
    <div class="kv"><span>Où sont mes données ?</span><b>Uniquement sur ce téléphone</b></div>
    <label class="l">Jour de ma paie (pour les suggestions de fin de mois)</label><input class="f" id="r-paie" type="number" min="1" max="31" value="${DB.reglages.paie}">
    <label class="l">Verrouiller après être sortie de l'appli</label>
    <select class="f" id="r-delai">${[[0, 'Immédiatement'], [60, '1 minute'], [300, '5 minutes'], [900, '15 minutes'], [3600, '1 heure'], [-1, 'Jamais']].map(([v, t]) => `<option value="${v}" ${v === DB.reglages.delai ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label class="l">Apparence</label>
    <div class="seg" id="r-mode">${[['auto', 'Auto'], ['clair', 'Clair'], ['sombre', 'Sombre']].map(([v, t]) => `<button data-v="${v}" class="${DB.reglages.mode === v ? 'on' : ''}">${t}</button>`).join('')}</div>
    <label class="l">Couleur</label>
    <div class="colors" id="r-acc">${[['violet', '#5b4bd6'], ['bleu', '#2563eb'], ['rose', '#db2777'], ['vert', '#059669'], ['orange', '#ea580c']].map(([v, c]) => `<button data-v="${v}" aria-label="${v}" style="background:${c}" class="${DB.reglages.acc === v ? 'on' : ''}"></button>`).join('')}</div>
    <button class="btn ghost" data-faceid>${localStorage.getItem(BIOK) ? 'Désactiver Face ID' : 'Activer Face ID'}</button>
    <button class="btn" data-export>Exporter une sauvegarde</button>
    <label class="btn ghost" style="display:block;text-align:center">Restaurer une sauvegarde<input type="file" accept="application/json,.json" data-import hidden></label>
    <button class="btn ghost" data-pin>Changer mon code</button>
    <p style="font-size:13px;color:var(--ink3);margin-top:14px">Pense à exporter une sauvegarde de temps en temps (dans Fichiers ou iCloud) : si tu changes de téléphone, tu pourras tout restaurer.</p>`);
  const box = $('sh');
  $('r-delai').onchange = () => { DB.reglages.delai = Number($('r-delai').value); save(); toast('Réglage enregistré ✓'); };
  $('r-mode').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; DB.reglages.mode = b.dataset.v; save(); applyTheme(); $('r-mode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); };
  $('r-acc').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; DB.reglages.acc = b.dataset.v; save(); applyTheme(); $('r-acc').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); };
  box.querySelector('[data-faceid]').onclick = async () => {
    if (localStorage.getItem(BIOK)) { localStorage.removeItem(BIOK); toast('Face ID désactivé'); closeSheet(); return; }
    const ok = await bioCreate(); toast(ok ? 'Face ID activé ✓' : 'Face ID indisponible sur cet appareil'); if (ok) closeSheet();
  };
  $('r-paie').onchange = () => { const v = Math.min(31, Math.max(1, parseInt($('r-paie').value, 10) || 25)); DB.reglages.paie = v; save(); renderAll(); toast('Jour de paie : le ' + v); };
  box.querySelector('[data-export]').onclick = async () => {
    const blob = new Blob([JSON.stringify(DB)], {type: 'application/json'});
    const name = 'mes-finances-' + today() + '.json';
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: 'Sauvegarde Mes Finances'}); return; } catch (e) { return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  };
  box.querySelector('[data-import]').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.tx || !d.cats) throw 0; DB = d; save(); closeSheet(); renderAll(); toast('Sauvegarde restaurée ✓'); } catch (x) { toast('Fichier non reconnu'); } };
    r.readAsText(f);
  };
  box.querySelector('[data-pin]').onclick = () => { closeSheet(); startLock('new'); };
}

/* ---------- Code à 4 chiffres ---------- */
async function hash(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mf:' + s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
const BIOK = 'mes_finances_bio';
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function bioCreate() {
  try {
    if (!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return false;
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: 'Mes Finances'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'moi', displayName: 'Mes Finances'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000
    }});
    localStorage.setItem(BIOK, b64(cred.rawId));
    return true;
  } catch (e) { return false; }
}
async function bioCheck() {
  const id = localStorage.getItem(BIOK);
  if (!id) return false;
  try {
    await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{type: 'public-key', id: unb64(id)}], userVerification: 'required', timeout: 60000}});
    return true;
  } catch (e) { return false; }
}
let pin = '', lockMode = 'check', first = '';
function startLock(mode) {
  lockMode = mode; pin = ''; first = '';
  $('lock').classList.remove('hide');
  $('lock-p').textContent = mode === 'new' ? 'Choisis un code à 4 chiffres' : 'Entre ton code';
  dots();
  const bio = mode === 'check' && !!localStorage.getItem(BIOK);
  $('btn-bio').classList.toggle('hide', !bio);
  if (bio) setTimeout(tryBio, 300);
}
async function tryBio() { if (await bioCheck()) { $('lock').classList.add('hide'); unlockedAt = Date.now(); } }
$('btn-bio').onclick = tryBio;
function dots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
$('pad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('');
$('pad').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b || !b.dataset.k) return;
  if (b.dataset.k === '⌫') { pin = pin.slice(0, -1); dots(); return; }
  if (pin.length >= 4) return;
  pin += b.dataset.k; dots();
  if (pin.length < 4) return;
  const h = await hash(pin);
  if (lockMode === 'check') {
    if (h === localStorage.getItem(PINK)) { $('lock').classList.add('hide'); unlockedAt = Date.now(); }
    else { $('dots').classList.add('shake'); setTimeout(() => { $('dots').classList.remove('shake'); pin = ''; dots(); }, 400); }
  } else if (!first) { first = h; pin = ''; $('lock-p').textContent = 'Confirme ton code'; dots(); }
  else if (h === first) { localStorage.setItem(PINK, h); $('lock').classList.add('hide'); unlockedAt = Date.now(); toast('Code enregistré ✓'); }
  else { first = ''; pin = ''; $('lock-p').textContent = 'Les codes ne correspondent pas. Recommence'; dots(); }
});
let unlockedAt = 0, hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else { genFixes(); renderAll(); if (localStorage.getItem(PINK) && hiddenAt && DB.reglages.delai >= 0 && Date.now() - hiddenAt >= DB.reglages.delai * 1000) { closeSheet(); startLock('check'); } }
});

/* ---------- Interactions ---------- */
document.addEventListener('click', (e) => {
  const sh = e.target.closest('#sh');
  if (sh && (e.target === sh || e.target.closest('[data-close]'))) { closeSheet(); return; }
  const t = e.target.closest('[data-tab]'); if (t) { showTab(t.dataset.tab); window.scrollTo(0, 0); return; }
  const g = e.target.closest('[data-goto]'); if (g) { showTab(g.dataset.goto); return; }
  const tx = e.target.closest('[data-tx]'); if (tx) { openTx(tx.dataset.tx); return; }
  const c = e.target.closest('[data-cat]'); if (c) { openCat(c.dataset.cat); return; }
  if (e.target.closest('[data-newcat]')) { openCat(); return; }
  const ns = e.target.closest('[data-newsub]'); if (ns) { openCat(null, ns.dataset.newsub); return; }
  const fx = e.target.closest('[data-fixe]'); if (fx) { openFixe(fx.dataset.fixe); return; }
  if (e.target.closest('[data-newfixe]')) { openFixe(); return; }
  if (e.target.closest('[data-newgoal]')) { openGoal(); return; }
  if (e.target.closest('[data-newcompte]')) { openCompte(); return; }
  const cp = e.target.closest('[data-compte]'); if (cp) { openCompte(cp.dataset.compte); return; }
  const vu = e.target.closest('[data-vue] button'); if (vu) { S.vue = vu.dataset.v; renderAnalyses(); return; }
  const pl = e.target.closest('[data-placer]'); if (pl) { placer(pl.dataset.placer, Number(pl.dataset.montant)); return; }
  const ga = e.target.closest('[data-gadd]'); if (ga) { openGoalAdd(ga.dataset.gadd); return; }
  const ge = e.target.closest('[data-gedit]'); if (ge) { openGoal(ge.dataset.gedit); return; }
});
document.addEventListener('input', (e) => { if (e.target.matches('[data-q]')) { S.q = e.target.value; const p = e.target.selectionStart; renderMouv(); const i = document.querySelector('[data-q]'); i.focus(); i.setSelectionRange(p, p); } });
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-fcat]')) { S.fCat = e.target.value; renderMouv(); }
  if (e.target.matches('[data-bud]')) { const c = DB.cats.find((x) => x.id === e.target.dataset.bud); const v = num(e.target.value || 0); c.budget = v > 0 ? v : 0; save(); renderHead(); renderAccueil(); renderBudgets(); toast('Budget enregistré ✓'); }
});
$('fab').onclick = () => openTx();
$('btn-reglages').onclick = openReglages;
$('m-prev').onclick = () => { S.mois = addMois(S.mois, -1); renderAll(); };
$('m-next').onclick = () => { S.mois = addMois(S.mois, 1); renderAll(); };

load(); renderAll();
startLock(localStorage.getItem(PINK) ? 'check' : 'new');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
